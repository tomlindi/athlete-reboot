<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Logo „Comeback-Loop“ nach Toms Entwurf: weißer Grund ohne Schimmer, Ring ohne blassen Übergang -->
  <rect width="512" height="512" fill="#ffffff"/>

  <!-- Drei Viertel des Rings, die Lücke steht für das Comeback, das noch läuft -->
  <path d="M 256 106 A 150 150 0 1 1 106 256" fill="none" stroke="#ff2d55" stroke-width="44" stroke-linecap="round"/>

  <!-- Blitz (Form nach Lucide „zap“, ISC-Lizenz) -->
  <path transform="translate(172 172) scale(7)" fill="#ff2d55"
        d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>
