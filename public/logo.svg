<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Logo „Comeback-Loop“ nach Toms Entwurf: fast geschlossener Ring mit Blitz auf dunklem Glas -->
  <defs>
    <radialGradient id="glowRed" cx="0.22" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ff375f" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff375f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.85" cy="0.88" r="0.6">
      <stop offset="0" stop-color="#bf5af2" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#bf5af2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#06070a"/>
  <rect width="512" height="512" fill="url(#glowRed)"/>
  <rect width="512" height="512" fill="url(#glowPurple)"/>

  <!-- Noch offenes Viertel des Rings (blass) -->
  <path d="M 106 256 A 150 150 0 0 1 256 106" fill="none" stroke="#ff375f" stroke-opacity="0.3" stroke-width="44"/>
  <!-- Geschafft: drei Viertel des Rings -->
  <path d="M 256 106 A 150 150 0 1 1 106 256" fill="none" stroke="#ff375f" stroke-width="44" stroke-linecap="round"/>

  <!-- Blitz (Form nach Lucide „zap“, ISC-Lizenz) -->
  <path transform="translate(172 172) scale(7)" fill="#ff375f"
        d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>
</svg>
